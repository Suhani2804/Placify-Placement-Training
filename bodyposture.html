<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real-Time Posture & Sentiment Detection</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e6e2f5, #f8f4fc);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 10px 30px rgba(106, 13, 173, 0.2);
      text-align: center;
    }

    h1 {
      color: #6a0dad;
      font-size: 2.3rem;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    h1 i {
      font-size: 30px;
      color: #6a0dad;
    }

    .video-container {
      position: relative;
      display: inline-block;
      border: 4px solid #6a0dad;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    #video {
      width: 640px;
      height: 480px;
      border-radius: 12px;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
      pointer-events: none;
    }

    #landmarkCanvas {
      width: 200px;
      height: 150px;
      border: 2px solid #6a0dad;
      border-radius: 12px;
      background-color: #fff;
      margin-bottom: 20px;
      box-shadow: 0 6px 15px rgba(106, 13, 173, 0.1);
    }

    .output {
      font-size: 20px;
      margin-top: 15px;
      font-weight: bold;
      color: #4b0082;
    }

    @media (max-width: 768px) {
      #video, #canvas {
        width: 100%;
        height: auto;
      }

      .video-container {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-person-running"></i>Real-Time Body Posture Detection</h1>

    <canvas id="landmarkCanvas"></canvas> <!-- Red dots render here -->

    <div class="video-container">
      <video id="video" autoplay></video>
      <canvas id="canvas"></canvas> <!-- For overlaying posture analysis -->
    </div>

    <p id="posture-status" class="output">Posture: Analyzing...</p>
    <p id="sentimentText" class="output">Sentiment: Analyzing...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/ml5"></script>
  <script src="bodyposture.js"></script>
</body>
</html>
