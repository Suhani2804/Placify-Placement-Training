<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chatbot.css"> <!-- 👈 added -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3e5f5;
        }

        .container {
            display: flex;
            height: 999vh;
            width: 100%;
        }

        .left-panel {
            width: 50%;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        .right-panel {
            width: 50%;
            padding: 40px;
            background-color: white;
            border-top-left-radius: 50px;
            border-bottom-left-radius: 50px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.1);
        }

        .welcome-text {
            font-size: 32px;
            font-weight: 600;
            color: #6a1b9a;
            margin-bottom: 10px;
        }

        .description-box {
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: white;
            padding: 20px;
            border-radius: 20px 0 20px 0;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .animation-box {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        

        .right-panel h2 {
            color: #6a1b9a;
        }

        .info p {
            margin: 5px 0;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        /* Apply this CSS to your buttons */
        .btn {
            background-color: #6a1b9a; /* Purple background */
            color: white;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
            height: 100px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .btn:hover {
            background-color: #4a148c; /* Darker purple on hover */
        }

        .btn i {
            font-size: 20px;
            margin-bottom: 8px;
        }


        .centered-button {
            grid-column: 2 / 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="welcome-text">Welcome to Placify 🎓</div>
            <div class="description-box">
                Placify is your one-stop placement assistant. Prepare for interviews, scan your resume using ATS, explore AI-curated courses, and get real-time job recommendations. Let's get you hired!
            </div>
    
            <div class="animation-box">
                <lottie-player
                    src="https://assets1.lottiefiles.com/packages/lf20_zrqthn6o.json"
                    background="transparent"
                    speed="1"
                    style="width: 250px; height: 250px;"
                    loop
                    autoplay>
                </lottie-player>
            </div>
    
          
        </div>
   
        <div class="right-panel">

            <h2>Welcome, <span id="user-name"></span></h2>
            <div class="info">
                <p>Course: <span class="info" id="user-course"></span></p>
                <p>Batch: <span class="info" id="user-batch"></span></p>
                <p>Branch: <span class="info" id="user-branch"></span></p>
                <p>Skills: <span class="info" id="user-skills"></span></p>
                <p>Email: <span class="info" id="user-email"></span></p>
                <p>Phone No.: <span class="info" id="user-phone"></span></p>
            </div>

            <div class="buttons">
                <button id="logout" class="btn"><i class="fas fa-sign-out-alt"  class="btn"></i>Logout</button>
                <button onclick="window.location.href='mock_interview.html'"  class="btn"><i class="fas fa-comments"></i>Take Behavioral Interview</button>
                <button onclick="window.location.href='ats_scanner.html'"  class="btn"><i class="fas fa-file-alt"></i>Scan Resume with ATS</button>
                <button onclick="window.location.href='ai_mock_interview.html'"  class="btn"><i class="fas fa-code"></i>Take Technical Interview</button>
                <button onclick="window.location.href='skills.html'" class="btn"><i class="fas fa-graduation-cap"></i>AI Course </button>
                <button onclick="window.open('http://localhost:5000', '_blank')" class="btn"><i class="fas fa-envelope"></i>Mail Connect</button>
                <button onclick="window.location.href='job_recommendation.html'" class="btn"><i class="fas fa-briefcase"></i>Job recommendation </button>
            </div>
        </div>
    </div>
    <script>
        // Fetch user data from localStorage
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
            alert("No user logged in!");
            window.location.href = "index.html";  // Redirect to login if no user found
        } else {
            document.getElementById("user-name").textContent = user.name || "N/A";
            document.getElementById("user-course").textContent = user.course || "N/A";
            document.getElementById("user-batch").textContent = user.batch || "N/A";
            document.getElementById("user-branch").textContent = user.branch || "N/A";
            document.getElementById("user-skills").textContent = user.skills || "N/A";
            document.getElementById("user-email").textContent = user.email || "N/A";
            document.getElementById("user-phone").textContent = user.phone || "N/A";
        }

        // Logout Function
        document.getElementById("logout").addEventListener("click", () => {
            localStorage.removeItem("user"); // Clear user session
            window.location.href = "index.html"; // Redirect to login
        });

        // Open Streamlit ATS Scanner in a new tab
        function openATS() {
            window.open("http://localhost:8501", "_blank");
        }
     
    </script>
  
  <!-- Chatbot HTML START -->

  <div id="chatbot-container">
    <div id="chatbot-toggle">  <!-- ✅ Clean HTML -->

        <div id="avatar"></div>
    </div>
    <div id="chatbot-window" class="hidden">
        <div id="chat-header">
            Placement Assistant
            <span onclick="toggleChatbot()" style="float: right; cursor: pointer;">✖</span> 
        </div>
        <div id="chat-body">
            <div id="chat-avatar"></div> <!-- Added for the talking avatar -->
        </div>
        <div id="chat-input">
            <input type="text" id="user-input" placeholder="Ask me something...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
<script>
    var animation = lottie.loadAnimation({
        container: document.getElementById("avatar"),
        renderer: "svg",
        loop: true,
        autoplay: true,
        path: "https://assets10.lottiefiles.com/packages/lf20_yr6zz3wv.json"
    });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
<script src="chatbot.js"></script>

</body>
</html>
